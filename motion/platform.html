<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d0b1f;font-family:"DejaVu Sans",sans-serif}
#s{position:relative;width:1080px;height:1920px;overflow:hidden}
.a{position:absolute;will-change:transform,opacity}
</style></head><body><div id="s"></div><script>
const S=document.getElementById('s');
const el=(h)=>{const d=document.createElement('div');d.className='a';d.innerHTML=h;S.appendChild(d);return d};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=t=>1-Math.pow(1-t,3), eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const p=(t,a,b)=>cl((t-a)/(b-a));
const set=(e,x,y,s=1,o=1,r=0)=>{e.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;e.style.opacity=o};
// background blobs
const blobs=[['#6c4cff',700,-200,-150],['#ff4d8d',600,600,1300],['#19d3a2',500,700,300]].map(([c,sz,x,y])=>{const b=el(`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${c};filter:blur(120px);opacity:.45"></div>`);b.d=[x,y];return b});
// grid dots
const grid=el(`<svg width="1080" height="1920"><defs><pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#ffffff14"/></pattern></defs><rect width="1080" height="1920" fill="url(#g)"/></svg>`);
// scene 1: logo
const logo=el(`<div style="width:260px;height:260px;border-radius:70px;background:linear-gradient(135deg,#7b5cff,#ff4d8d);display:flex;align-items:center;justify-content:center;font:900 110px 'DejaVu Sans';color:#fff;box-shadow:0 30px 80px #6c4cff88">JTS</div>`);
const title=el(`<div style="width:1080px;text-align:center;font:900 96px 'DejaVu Sans';color:#fff;letter-spacing:-2px">Just to Study <span style="color:#19d3a2">AI</span></div>`);
const sub=el(`<div style="width:1080px;text-align:center;font:700 44px 'DejaVu Sans';color:#b9b3ff">Учись с ИИ-тьютором 24/7</div>`);
// phone
const phone=el(`<div style="width:620px;height:1240px;border-radius:80px;background:#16132e;border:14px solid #2a2550;box-shadow:0 40px 120px #000a;overflow:hidden;position:relative">
<div style="height:150px;background:linear-gradient(135deg,#7b5cff,#ff4d8d);display:flex;align-items:center;padding:0 40px;gap:24px">
<div style="width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px">🦉</div>
<div style="color:#fff"><div style="font:800 38px 'DejaVu Sans'">Луна</div><div style="font:600 26px 'DejaVu Sans';opacity:.85">● онлайн</div></div></div>
<div id="chat" style="padding:34px;display:flex;flex-direction:column;gap:24px"></div></div>`);
const chat=phone.querySelector('#chat');
const msgs=[[1,'Объясни Present Perfect 🙏'],[0,'Легко! Это действие, результат которого важен <b>сейчас</b> ✨'],[0,'<i>I have just finished</i> — я только что закончил'],[1,'А можно упражнение?'],[0,'Конечно! Вот 5 заданий 👇']];
const bub=msgs.map(([me,t])=>{const b=document.createElement('div');b.style.cssText=`align-self:${me?'flex-end':'flex-start'};max-width:430px;padding:24px 30px;border-radius:34px;font:600 30px/1.35 'DejaVu Sans';color:#fff;background:${me?'#7b5cff':'#2a2550'};transform-origin:${me?'right':'left'} bottom;opacity:0`;b.innerHTML=t;chat.appendChild(b);return b});
const typing=document.createElement('div');typing.style.cssText='align-self:flex-start;padding:24px 30px;border-radius:34px;background:#2a2550;display:flex;gap:10px;opacity:0';typing.innerHTML='<i></i><i></i><i></i>'.replace(/<i><\/i>/g,'<span style="width:16px;height:16px;border-radius:50%;background:#b9b3ff;display:block"></span>');chat.appendChild(typing);
// scene 3: feature cards
const feats=[['🎯','Персональный план','#7b5cff'],['🗣️','Разговорная практика','#ff4d8d'],['📈','Прогресс каждый день','#19d3a2']].map(([i,t,c])=>el(`<div style="width:840px;height:200px;border-radius:50px;background:#1c1840;border:3px solid ${c}55;display:flex;align-items:center;gap:40px;padding:0 50px"><div style="width:120px;height:120px;border-radius:36px;background:${c};display:flex;align-items:center;justify-content:center;font-size:64px">${i}</div><div style="font:800 50px 'DejaVu Sans';color:#fff">${t}</div></div>`));
// scene 4: chart
const chart=el(`<div style="width:840px;height:700px;border-radius:60px;background:#1c1840;padding:60px;position:relative"><div style="font:800 52px 'DejaVu Sans';color:#fff">Твой прогресс</div><div style="font:900 120px 'DejaVu Sans';color:#19d3a2;margin-top:10px" id="pct">0%</div><div id="bars" style="position:absolute;left:60px;right:60px;bottom:60px;height:300px;display:flex;align-items:flex-end;gap:28px"></div></div>`);
const bars=[30,45,40,60,72,85,100].map((h,i)=>{const b=document.createElement('div');b.style.cssText=`flex:1;height:${h}%;border-radius:20px;background:${i==6?'linear-gradient(#19d3a2,#0fa37e)':'#7b5cff'};transform-origin:bottom`;chart.querySelector('#bars').appendChild(b);return b});
const pct=chart.querySelector('#pct');
// CTA
const cta1=el(`<div style="width:1080px;text-align:center;font:900 110px/1.05 'DejaVu Sans';color:#fff">Начни<br><span style="color:#ff4d8d">бесплатно</span></div>`);
const btn=el(`<div style="width:700px;height:160px;border-radius:80px;background:linear-gradient(135deg,#7b5cff,#ff4d8d);display:flex;align-items:center;justify-content:center;font:900 54px 'DejaVu Sans';color:#fff;box-shadow:0 30px 80px #ff4d8d66">Попробовать →</div>`);
const D=12;
window.render=(t)=>{
 blobs.forEach((b,i)=>set(b,b.d[0]+Math.sin(t*.6+i*2)*120,b.d[1]+Math.cos(t*.5+i)*140));
 set(grid,0,-(t*30)%60);
 // S1 0-2.6
 const l=back(p(t,.1,.7)), lo=1-eio(p(t,2.2,2.6));
 set(logo,410,560-lo*0+(1-lo)*-200,l*(1+(1-lo)*-.4),lo,(1-l)*-25);
 set(title,0,880+(1-eo(p(t,.5,1)))*80,1,eo(p(t,.5,1))*lo);
 set(sub,0,1010+(1-eo(p(t,.75,1.25)))*80,1,eo(p(t,.75,1.25))*lo);
 // S2 phone 2.4-6.6
 const pin=eo(p(t,2.4,3.0)), pout=eio(p(t,6.2,6.7));
 set(phone,230,340+(1-pin)*1400-pout*1600,1,pin>0?1:0,(1-pin)*8);
 const times=[3.0,4.1,4.9,5.4,6.0];
 bub.forEach((b,i)=>{const k=back(p(t,times[i],times[i]+.35));b.style.opacity=cl(k*2);b.style.transform=`scale(${k})`;b.style.display=t<times[i]-.01&&i>0?'none':'block'});
 const typ=(t>3.35&&t<4.1)||(t>5.6&&t<6.0);typing.style.opacity=typ?1:0;typing.style.display=typ?'flex':'none';
 typing.querySelectorAll('span').forEach((s,i)=>s.style.transform=`translateY(${Math.sin(t*14-i)*6}px)`);
 // S3 cards 6.6-8.9
 feats.forEach((f,i)=>{const k=back(p(t,6.6+i*.18,7.1+i*.18)),o=eio(p(t,8.5+i*.08,8.9+i*.08));set(f,120+(1-k)*900-o*1100,640+i*250,1,k>0?1:0)});
 // S4 chart 8.9-10.8
 const ci=back(p(t,8.9,9.4)), co=eio(p(t,10.5,10.9));
 set(chart,120,560,ci*(1-co*.3),ci*(1-co));
 bars.forEach((b,i)=>b.style.transform=`scaleY(${eo(p(t,9.2+i*.08,9.7+i*.08))})`);
 pct.textContent='+'+Math.round(eo(p(t,9.2,10.2))*87)+'%';
 // S5 CTA 10.8-12
 const k1=back(p(t,10.8,11.25)),k2=back(p(t,11.05,11.5));
 set(cta1,0,640,k1,cl(k1*2));
 set(btn,190,1000,k2*(1+Math.sin(Math.max(0,t-11.5)*8)*.03),cl(k2*2));
};
window.D=D;render(0);
</script></body></html>
